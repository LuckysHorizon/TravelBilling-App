name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::120896953027:role/TravelBillingGitHubActionsRole
          aws-region: ap-south-1
          allowed-account-ids: "120896953027"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECR authorization
        run: aws ecr get-login-password --region ap-south-1 > /dev/null 